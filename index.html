<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Auditoría gratis de tu perfil en Google | Guitorant</title>
  <meta name="description" content="Descubre en 3 minutos cómo está tu negocio en Google frente a tu competencia y pide tu tarjeta de reseñas.">
  <meta name="theme-color" content="#F7F9FB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2315803D'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Cabecera fija: logo + flecha para volver + barra de progreso + porcentaje -->
  <header class="cabecera">
    <div class="cabecera__interior">
      <span class="logo"><img src="assets/marca/logo-guitorant.webp" width="28" height="28" alt="Guitorant"></span>
      <button class="atras oculto" id="atras" type="button" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="progreso" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progreso__relleno" id="progreso"></div>
      </div>
      <span class="porcentaje" id="porcentaje" aria-hidden="true">0%</span>
    </div>
    <div class="hito" id="hito" role="status" aria-live="polite"></div>
  </header>

  <!-- Aquí se dibuja cada pantalla -->
  <main class="app" id="app"></main>

  <!-- Botón principal fijo abajo -->
  <div class="barra-cta" id="barra-cta" hidden>
    <div class="barra-cta__interior">
      <button class="boton" id="cta" type="button"></button>
    </div>
  </div>

  <noscript><p style="padding:20px">Necesitas activar JavaScript para ver esta página.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/google.js"></script>
  <script src="js/nieve.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
